[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tileforge"
version = "0.1.0"
description = "An original, educational tensor-kernel compiler with SSA IR, optimization passes, and reference interpreter"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.24.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]

[project.scripts]
tileforge = "tileforge.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
